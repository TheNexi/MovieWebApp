<main class="app-shell">
  <ng-container *ngIf="loggedIn; else authOnly">
    <nav class="app-nav">
      <a routerLink="/home">Strona główna</a>
      <a routerLink="/advanced-search">Wyszukiwarka</a>
      <a routerLink="/movie/1">Filmy</a>
      <div class="nav-right">
  <button class="btn btn-danger" (click)="logout()">
    Wyloguj
  </button>
</div>
    </nav>
    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </ng-container>
  <ng-template #authOnly>
    <router-outlet></router-outlet>
  </ng-template>
</main>
